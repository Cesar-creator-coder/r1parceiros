<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#d9233e">
  <title>R1 Gestor - Painel do Lojista</title>

  <!-- Manifesto PWA Exclusivo do Lojista -->
  <link rel="manifest" href="./manifest-loja.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%23121417'/><circle cx='256' cy='256' r='210' fill='none' stroke='%23d9233e' stroke-width='16'/><path d='M120 200l25-80h222l25 80v200H120V200zm60 40c16.5 0 30-13.5 30-30s-13.5-30-30-30-30 13.5-30 30 13.5 30 30 30zm152 0c16.5 0 30-13.5 30-30s-13.5-30-30-30-30 13.5-30 30 13.5 30 30 30z' fill='%23d9233e'/><text x='50%25' y='460' text-anchor='middle' fill='%23ffffff' font-family='Arial,sans-serif' font-weight='900' font-size='56'>R1 LOJAS</text></svg>">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary: #d9233e;
      --primary-dark: #b71931;
      --dark: #121417;
      --dark-card: #1c1f24;
      --white: #ffffff;
      --bg: #f4f5f7;
      --text: #1d2129;
      --muted: #656d76;
      --border: #e2e5e9;
      --green: #168a55;
      --warning: #d97706;
      --gold: #ff8a00;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 40px;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }
    .app {
      max-width: 680px;
      margin: auto;
      background: var(--white);
      min-height: 100vh;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      position: relative;
    }
    .top {
      position: sticky;
      top: 0;
      z-index: 30;
      background: linear-gradient(135deg, var(--dark), #262a30);
      color: var(--white);
      padding: 14px 16px;
      border-bottom: 3px solid var(--primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-badge {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--primary);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 20px;
      box-shadow: 0 4px 12px rgba(217,35,62,0.3);
      overflow: hidden;
    }
    .logo-badge img { width: 100%; height: 100%; object-fit: cover; }
    .brand h1 { margin: 0; font-size: 18px; color: var(--white); font-weight: 900; }
    .brand small { color: #cbd0d6; font-weight: 700; font-size: 11px; text-transform: uppercase; }

    .install-pwa-bar {
      background: linear-gradient(135deg, #1c1f24, #121417);
      color: #fff;
      padding: 12px 16px;
      border-bottom: 2px solid var(--primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .install-pwa-bar b { color: var(--primary); font-size: 13px; }

    .tabs {
      display: flex;
      gap: 6px;
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .tab {
      border: 1px solid #ddd;
      background: var(--white);
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 13px;
      white-space: nowrap;
    }
    .tab.active { background: var(--dark); color: var(--white); border-color: var(--dark); }

    .main-body { padding: 14px 16px; }

    .admin-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
    .metric {
      background: #f8f9fa;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
    }
    .metric small { color: var(--muted); font-size: 11px; }
    .metric strong { display: block; font-size: 18px; margin-top: 4px; }

    .panel {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      background: var(--white);
    }
    .panel h3 { margin: 0 0 8px; font-size: 16px; }
    .hint { font-size: 12px; color: var(--muted); line-height: 1.4; margin: 0 0 10px; }

    .order-card-history {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: #fcfcfc;
      margin-bottom: 10px;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .status {
      display: inline-flex;
      padding: 4px 8px;
      border-radius: 12px;
      background: #dff8e9;
      color: #187a4d;
      font-size: 11px;
      font-weight: 900;
    }
    .status.closed { background: #fee2e2; color: #b91c1c; }
    .status.warning { background: #fef3c7; color: #d97706; }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 12px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }
    .btn.red { background: var(--primary); color: var(--white); }
    .btn.dark { background: var(--dark); color: var(--white); }
    .btn.green { background: var(--green); color: var(--white); }
    .btn.warning { background: var(--warning); color: var(--white); }
    .btn.outline { background: #f0f2f5; border: 1px solid #d0d4dc; color: var(--text); }

    .form { display: grid; gap: 10px; }
    .field label { display: block; font-size: 12px; font-weight: 800; margin-bottom: 4px; }
    .field input, .field select, .field textarea { width: 100%; padding: 11px; border: 1px solid #d9dde2; border-radius: 10px; }
    .field-checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff8f0;
      border: 1px dashed var(--gold);
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
    }
    .field-checkbox input { width: auto; cursor: pointer; }
    .field-checkbox b { font-size: 13px; color: #b45309; }

    .file-preview {
      height: 120px;
      border: 2px dashed #ccc;
      border-radius: 12px;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #fafafa;
      color: #888;
      margin-top: 4px;
    }
    .file-preview img, .file-preview video { width: 100%; height: 100%; object-fit: contain; background: #000; }

    .login-container {
      padding: 30px 20px;
      max-width: 400px;
      margin: auto;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }
    .row:last-child { border: 0; }

    .toast {
      position: fixed;
      z-index: 200;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--dark);
      color: var(--white);
      padding: 11px 16px;
      border-radius: 12px;
      display: none;
      max-width: 90%;
      text-align: center;
      border: 1px solid var(--primary);
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal.show { display: flex; }
    .sheet {
      background: var(--white);
      width: min(560px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 20px;
      padding: 18px;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- BARRA DE INSTALAÇÃO DO APP DO LOJISTA -->
    <div id="pwaBanner" class="install-pwa-bar hidden">
      <div>
        <b>Instalar App R1 Lojas</b><br>
        <small style="color:#ccc;">Receba pedidos com som de campainha no balcão</small>
      </div>
      <button class="btn red" style="width:auto;padding:8px 14px;font-size:12px;" onclick="triggerPwaInstall()">Instalar</button>
    </div>

    <header class="top">
      <div class="brand">
        <div class="logo-badge" id="topStoreLogo">🏪</div>
        <div>
          <h1 id="topStoreName">R1 GESTOR</h1>
          <small id="topStoreCategory">Painel do Lojista</small>
        </div>
      </div>
      <div id="topActions" class="hidden">
        <button class="btn red" style="width:auto;padding:6px 12px;font-size:11px;" onclick="logoutStore()">Sair</button>
      </div>
    </header>

    <!-- TELA DE LOGIN DO LOJISTA -->
    <div id="authScreen" class="login-container">
      <div class="panel">
        <h3 style="text-align:center;margin-bottom:14px;">Acesso do Estabelecimento</h3>
        <div class="form">
          <div class="field">
            <label>Usuário, ID ou WhatsApp</label>
            <input id="loginUser" placeholder="Ex: claudinha ou número">
          </div>
          <div class="field">
            <label>Senha de Acesso</label>
            <input type="password" id="loginPass" placeholder="Sua senha">
          </div>
          <button class="btn red" onclick="doStoreLogin()">Entrar no Painel</button>
          <p class="hint" style="text-align:center;margin-top:8px;">Credencial padrão inicial: usuário / <b>1234</b></p>
        </div>
      </div>
    </div>

    <!-- PAINEL OPERACIONAL DA LOJA -->
    <div id="mainScreen" class="hidden">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('pedidos', this)">Pedidos ao Vivo</button>
        <button class="tab" onclick="switchTab('produtos', this)">Cardápio & Promoções</button>
        <button class="tab" onclick="switchTab('lote', this)">Importar em Lote</button>
        <button class="tab" onclick="switchTab('status', this)">Stories 9:16 & Capa</button>
        <button class="tab" onclick="switchTab('relatorios', this)">Relatório de Vendas</button>
        <button class="tab" onclick="switchTab('dados', this)">Dados da Loja</button>
      </div>

      <div class="main-body" id="tabContent"></div>
    </div>
  </div>

  <!-- MODAL DE EDIÇÃO DE PRODUTO -->
  <div id="editProductModal" class="modal">
    <div class="sheet">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h2 style="margin:0;font-size:18px;">✏️ Editar Produto</h2>
        <button class="btn outline" style="width:auto;padding:6px 10px;" onclick="closeModal('editProductModal')">✕</button>
      </div>
      <div class="form">
        <input type="hidden" id="editProdCatName">
        <input type="hidden" id="editProdIndex">
        <div class="field">
          <label>Nome do Produto</label>
          <input id="editProdName">
        </div>
        <div class="field">
          <label>Preço de Venda (R$)</label>
          <input id="editProdPrice" type="number" step="0.01">
        </div>
        <div class="field">
          <label>Descrição</label>
          <textarea id="editProdDesc"></textarea>
        </div>
        <div class="field">
          <label>Link da Foto (URL)</label>
          <input id="editProdImg" oninput="previewDirect('editProdImg', 'editProdPreview')">
        </div>
        <div class="field">
          <label>Ou Upload da Foto (1:1)</label>
          <input type="file" accept="image/*" onchange="previewUpload(this, 'editProdPreview', 'editProdImg', 400)">
          <div id="editProdPreview" class="file-preview">Prévia</div>
        </div>
        <div class="field-checkbox">
          <input type="checkbox" id="editProdIsPromo">
          <label for="editProdIsPromo" style="cursor:pointer;margin:0;"><b>🔥 Destacar na Promoção do Dia</b></label>
        </div>
        <div class="field-checkbox" style="background:#f4f5f7;border-color:#ccc;">
          <input type="checkbox" id="editProdPaused">
          <label for="editProdPaused" style="cursor:pointer;margin:0;"><b>Pausar Produto (Indisponível temporariamente)</b></label>
        </div>
        <button class="btn red" onclick="saveProductEdits()">Salvar Alterações</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    /* 1. REGISTRO SERVICE WORKER E INSTALAÇÃO PWA */
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }

    let deferredPrompt = null;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById("pwaBanner").classList.remove("hidden");
    });

    function triggerPwaInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choice) => {
          if (choice.outcome === "accepted") {
            toast("✅ App R1 Lojas instalado com sucesso!");
          }
          deferredPrompt = null;
          document.getElementById("pwaBanner").classList.add("hidden");
        });
      } else {
        toast("Toque nos 3 pontinhos do Chrome > 'Instalar aplicativo'");
      }
    }

    /* 2. PERSISTÊNCIA E SINCRONIZAÇÃO COM FIREBASE */
    const DB_KEY = "r1_marketplace_red_black_v21_final";
    let db = JSON.parse(localStorage.getItem(DB_KEY) || "null") || {};
    let loggedPartner = null;
    let currentTab = "pedidos";
    let reportPeriod = "todos";
    let lastOrderCount = 0;

    const firebaseConfig = {
      apiKey: "AIzaSyDr1B-SDuq4V1lxbrgCHm8TyLSIdfEohZY",
      authDomain: "r1-parceiros.firebaseapp.com",
      projectId: "r1-parceiros",
      storageBucket: "r1-parceiros.firebasestorage.app",
      messagingSenderId: "511261654273",
      appId: "1:511261654273:web:0dfbfa8e92828db829ef00"
    };

    let fsDb = null;
    try {
      firebase.initializeApp(firebaseConfig);
      fsDb = firebase.firestore();
    } catch(e) {}

    function toast(t) {
      const x = document.getElementById("toast");
      if (!x) return;
      x.textContent = t;
      x.style.display = "block";
      clearTimeout(window.tt);
      window.tt = setTimeout(() => x.style.display = "none", 2500);
    }

    function money(v) {
      return (Number(v) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    }

    function openModal(id) { document.getElementById(id).classList.add("show"); }
    function closeModal(id) { document.getElementById(id).classList.remove("show"); }

    /* TOCADOR DE CAMPAINHA / ALERTA SONORO DE NOVO PEDIDO */
    function playOrderBell() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } catch(e) {}
    }

    function saveDb() {
      try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch(e) {}
      if (fsDb) {
        fsDb.collection("marketplace").doc("main_data").set(db).catch(() => {});
      }
    }

    function init() {
      if (fsDb) {
        fsDb.collection("marketplace").doc("main_data").onSnapshot(doc => {
          if (doc.exists && doc.data()) {
            db = doc.data();
            try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch(e) {}

            const savedPartnerId = localStorage.getItem("r1_active_partner_id");
            if (savedPartnerId && db.partners) {
              const found = db.partners.find(p => p.id.toString() === savedPartnerId.toString());
              if (found) {
                loggedPartner = found;
                const myOrders = (db.orders || []).filter(o => o.storeId === loggedPartner.id);
                if (myOrders.length > lastOrderCount) {
                  playOrderBell();
                  toast("🔔 NOVO PEDIDO RECEBIDO NO BALCÃO!");
                }
                lastOrderCount = myOrders.length;
                renderCurrentTab();
              }
            }
          }
        });
      }

      const savedPartnerId = localStorage.getItem("r1_active_partner_id");
      if (savedPartnerId && db.partners) {
        const found = db.partners.find(p => p.id.toString() === savedPartnerId.toString());
        if (found) {
          loggedPartner = found;
          enterDashboard();
        }
      }
    }

    function doStoreLogin() {
      const u = (document.getElementById("loginUser").value || "").trim().toLowerCase();
      const p = (document.getElementById("loginPass").value || "").trim();

      if (!u || !p) return toast("Preencha usuário e senha.");

      const found = (db.partners || []).find(x => 
        (x.username && x.username.toLowerCase() === u) || 
        (x.id && x.id.toString().toLowerCase() === u) ||
        (x.whatsapp && x.whatsapp.replace(/\D/g,"") === u.replace(/\D/g,""))
      );

      if (found && (found.pass || "1234").toString() === p) {
        loggedPartner = found;
        localStorage.setItem("r1_active_partner_id", found.id.toString());
        enterDashboard();
        toast(`✅ Bem-vindo, ${found.name}!`);
      } else {
        toast("❌ Usuário ou senha incorretos.");
      }
    }

    function enterDashboard() {
      document.getElementById("authScreen").classList.add("hidden");
      document.getElementById("mainScreen").classList.remove("hidden");
      document.getElementById("topActions").classList.remove("hidden");
      document.getElementById("topStoreName").textContent = loggedPartner.name;
      document.getElementById("topStoreCategory").textContent = loggedPartner.category;
      
      const logoEl = document.getElementById("topStoreLogo");
      if (loggedPartner.logo) {
        logoEl.innerHTML = `<img src="${loggedPartner.logo}" alt="Logo">`;
      } else {
        logoEl.innerHTML = "🏪";
      }

      const myOrders = (db.orders || []).filter(o => o.storeId === loggedPartner.id);
      lastOrderCount = myOrders.length;
      renderCurrentTab();
    }

    function logoutStore() {
      localStorage.removeItem("r1_active_partner_id");
      loggedPartner = null;
      document.getElementById("authScreen").classList.remove("hidden");
      document.getElementById("mainScreen").classList.add("hidden");
      document.getElementById("topActions").classList.add("hidden");
      document.getElementById("topStoreName").textContent = "R1 GESTOR";
      document.getElementById("topStoreCategory").textContent = "Painel do Lojista";
      toast("Sessão finalizada.");
    }

    function switchTab(tab, btn) {
      currentTab = tab;
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      if (btn) btn.classList.add("active");
      renderCurrentTab();
    }

    function renderCurrentTab() {
      const container = document.getElementById("tabContent");
      if (!loggedPartner) return;

      const p = loggedPartner;

      if (currentTab === "pedidos") {
        const myOrders = (db.orders || []).filter(o => o.storeId === p.id && !o.hiddenForStore);
        container.innerHTML = `
          <div class="panel">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <h3>📋 Pedidos em Tempo Real (${myOrders.length})</h3>
              <span class="status ${p.open ? '' : 'closed'}">${p.open ? '● Aberto' : '● Fechado'}</span>
            </div>
            <p class="hint">Gerencie o preparo, despacho e acione os motoboys da Equipe R1.</p>

            <div style="margin-top:10px;">
              ${myOrders.map(o => `
                <div class="order-card-history">
                  <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding-bottom:6px;margin-bottom:6px;">
                    <b>Pedido ${o.id}</b>
                    <span style="color:var(--green);font-weight:900;">${money(o.total)}</span>
                  </div>
                  <div><b>Cliente:</b> ${o.customerName} (${o.customerPhone})</div>
                  <div><b>Modo:</b> ${o.orderType === 'retirada' ? '🏪 Retirada no Balcão' : '🛵 Entrega'}</div>
                  ${o.customerAddress ? `<div><b>Endereço:</b> ${o.customerAddress}</div>` : ''}
                  <div><b>Pagamento:</b> ${o.payment}</div>
                  <div style="margin-top:4px;color:#555;"><b>Itens:</b> ${(o.items || []).map(it => `${it.qty}x ${it.name}`).join(", ")}</div>

                  <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center;">
                    <span class="status ${o.status === 'Despachado' ? 'warning' : (o.status === 'Entregue' ? '' : 'closed')}">
                      ${o.status || 'Novo'}
                    </span>
                    <button class="btn green" style="width:auto;padding:6px 10px;font-size:11px;" onclick="shareOrderToGroup('${o.id}')">
                      📢 Chamar Motoboys R1
                    </button>
                    <button class="btn warning" style="width:auto;padding:6px 10px;font-size:11px;" onclick="updateOrderStatus('${o.id}', 'Despachado')">
                      🛵 Despachado
                    </button>
                    <button class="btn green" style="width:auto;padding:6px 10px;font-size:11px;" onclick="updateOrderStatus('${o.id}', 'Entregue')">
                      ✓ Concluído
                    </button>
                    <button class="btn red" style="width:auto;padding:6px 8px;font-size:11px;" onclick="hideOrder('${o.id}')">
                      ✕ Ocultar
                    </button>
                  </div>
                </div>
              `).join("") || '<p class="hint" style="text-align:center;padding:20px 0;">Nenhum pedido ativo no momento. Quando um cliente comprar, tocará a campainha aqui!</p>'}
            </div>
          </div>
        `;
      } else if (currentTab === "produtos") {
        container.innerHTML = `
          <div class="panel">
            <h3>➕ Cadastrar Novo Produto</h3>
            <div class="form">
              <div class="field">
                <label>Categoria</label>
                <select id="newCat">
                  ${(p.categories || []).map(c => `<option value="${c.name}">${c.name}</option>`).join("") || '<option value="GERAL">GERAL</option>'}
                </select>
              </div>
              <div class="field">
                <label>Nome do Produto</label>
                <input id="newName" placeholder="Ex: Pastel Especial de Carne">
              </div>
              <div class="field">
                <label>Preço de Venda (R$)</label>
                <input id="newPrice" type="number" step="0.01" placeholder="Ex: 18.00">
              </div>
              <div class="field-checkbox">
                <input type="checkbox" id="newIsPromo">
                <label for="newIsPromo" style="cursor:pointer;margin:0;"><b>🔥 Destacar na Promoção do Dia</b></label>
              </div>
              <div class="field">
                <label>Descrição</label>
                <textarea id="newDesc" placeholder="Ingredientes e detalhes..."></textarea>
              </div>
              <div class="field">
                <label>Link da Foto (URL)</label>
                <input id="newImgUrl" placeholder="https://..." oninput="previewDirect('newImgUrl', 'prodPreview')">
              </div>
              <div class="field">
                <label>Ou Upload da Foto (1:1)</label>
                <input type="file" accept="image/*" onchange="previewUpload(this, 'prodPreview', 'newImgUrl', 400)">
                <div id="prodPreview" class="file-preview">Prévia da Foto</div>
              </div>
              <button class="btn red" onclick="addProduct()">+ Adicionar ao Cardápio</button>
            </div>
          </div>

          <div class="panel">
            <h3>Cardápio Cadastrado (${(p.categories || []).reduce((a, c) => a + (c.products || []).length, 0)} itens)</h3>
            ${(p.categories || []).map(c => `
              <p style="margin:12px 0 4px;font-weight:900;color:var(--dark);">📂 ${c.name}</p>
              ${(c.products || []).map((x, idx) => `
                <div class="row">
                  <div style="display:flex;align-items:center;gap:10px;">
                    <div style="width:40px;height:40px;border-radius:8px;background:#f0f0f0;overflow:hidden;display:grid;place-items:center;">
                      ${x.image ? `<img src="${x.image}" style="width:100%;height:100%;object-fit:cover;">` : '🍽️'}
                    </div>
                    <span>
                      <b>${x.name}</b> — <span style="color:var(--green);font-weight:900;">${money(x.price)}</span><br>
                      <small style="color:var(--muted);">${x.paused ? '<b style="color:red">Pausado</b>' : 'Ativo'}</small>
                    </span>
                  </div>
                  <div style="display:flex;gap:4px;">
                    <button class="btn outline" style="width:auto;padding:5px 8px;font-size:11px;" onclick="openEditProduct('${c.name}', ${idx})">✏️</button>
                    <button class="btn dark" style="width:auto;padding:5px 8px;font-size:11px;" onclick="togglePauseProduct('${c.name}', ${idx})">${x.paused ? 'Ativar' : 'Pausar'}</button>
                    <button class="btn red" style="width:auto;padding:5px 8px;font-size:11px;" onclick="removeProduct('${c.name}', ${idx})">✕</button>
                  </div>
                </div>
              `).join("") || '<p class="hint">Nenhum produto nesta categoria.</p>'}
            `).join("")}
          </div>
        `;
      } else if (currentTab === "lote") {
        container.innerHTML = `
          <div class="panel">
            <h3>📋 Importação Rápida de Produtos por Lote</h3>
            <div class="hint">
              Cole sua lista no formato:<br>
              <code>Nome - Descrição - Preço</code><br>
              <i>Ex: Pastel de Queijo - Queijo mussarela derretido - 14.00</i>
            </div>
            <div class="form">
              <div class="field">
                <label>Categoria de Destino</label>
                <select id="batchCat">
                  ${(p.categories || []).map(c => `<option value="${c.name}">${c.name}</option>`).join("") || '<option value="GERAL">GERAL</option>'}
                </select>
              </div>
              <div class="field">
                <label>Cole os itens (um por linha)</label>
                <textarea id="batchText" style="min-height:160px;" placeholder="Item 1 - Descrição - 15.00&#10;Item 2 - Descrição - 20.00"></textarea>
              </div>
              <button class="btn red" onclick="processBatch()">Processar e Cadastrar Todos</button>
            </div>
          </div>
        `;
      } else if (currentTab === "status") {
        if (!p.statuses) p.statuses = [];
        container.innerHTML = `
          <div class="panel">
            <h3>📱 Publicar Status / Stories 9:16</h3>
            <div class="form">
              <div class="field">
                <label>Título da Oferta do Vídeo</label>
                <input id="stTitle" placeholder="Ex: Pastel em Dobro Hoje!">
              </div>
              <div class="field">
                <label>Tipo de Mídia</label>
                <select id="stType">
                  <option value="video">Vídeo Vertical MP4</option>
                  <option value="image">Foto / Arte Vertical</option>
                </select>
              </div>
              <div class="field">
                <label>Link da Mídia (URL)</label>
                <input id="stUrl" placeholder="https://..." oninput="previewDirect('stUrl', 'stPreview')">
              </div>
              <div class="field">
                <label>Ou Upload do Arquivo</label>
                <input type="file" accept="video/mp4,video/*,image/*" onchange="previewUpload(this, 'stPreview', 'stUrl', 400)">
                <div id="stPreview" class="file-preview">Prévia do Status</div>
              </div>
              <button class="btn red" onclick="addStatus()">+ Publicar Stories</button>
            </div>
          </div>

          <div class="panel">
            <h3>Stories Ativos (${p.statuses.length})</h3>
            ${p.statuses.map((st, idx) => `
              <div class="row">
                <span><b>${st.title || 'Stories'}</b> (${st.type})</span>
                <button class="btn red" style="width:auto;padding:5px 8px;font-size:11px;" onclick="removeStatus(${idx})">✕ Excluir</button>
              </div>
            `).join("") || '<p class="hint">Nenhum status publicado.</p>'}
          </div>

          <div class="panel">
            <h3>🖼️ Banner de Capa do Catálogo</h3>
            <div class="form">
              <div class="field">
                <label>Link da Imagem da Capa</label>
                <input id="bannerUrl" value="${p.banner || ''}" placeholder="https://..." oninput="previewDirect('bannerUrl', 'capaPreview')">
              </div>
              <div class="field">
                <label>Ou Upload da Imagem</label>
                <input type="file" accept="image/*" onchange="previewUpload(this, 'capaPreview', 'bannerUrl', 600)">
                <div id="capaPreview" class="file-preview">${p.banner ? `<img src="${p.banner}">` : 'Sem capa'}</div>
              </div>
              <button class="btn dark" onclick="saveBanner()">Salvar Capa</button>
            </div>
          </div>
        `;
      } else if (currentTab === "relatorios") {
        let orders = (db.orders || []).filter(o => o.storeId === p.id && !o.hiddenForStore);
        const now = new Date();

        if (reportPeriod === "hoje") {
          orders = orders.filter(o => new Date(o.date).toDateString() === now.toDateString());
        } else if (reportPeriod === "semana") {
          const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
          orders = orders.filter(o => new Date(o.date) >= weekAgo);
        } else if (reportPeriod === "mes") {
          orders = orders.filter(o => {
            const d = new Date(o.date);
            return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
          });
        }

        const totalVal = orders.reduce((acc, o) => acc + (o.total || 0), 0);

        container.innerHTML = `
          <div class="panel">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
              <h3>Relatório de Vendas</h3>
              <button class="btn dark" style="width:auto;padding:6px 12px;font-size:11px;" onclick="window.print()">📄 Imprimir / PDF</button>
            </div>

            <div style="margin-bottom:12px;">
              <label style="font-weight:800;font-size:12px;">Período:</label>
              <select onchange="reportPeriod = this.value; renderCurrentTab();">
                <option value="todos" ${reportPeriod === 'todos' ? 'selected' : ''}>Todo o Histórico</option>
                <option value="hoje" ${reportPeriod === 'hoje' ? 'selected' : ''}>Hoje</option>
                <option value="semana" ${reportPeriod === 'semana' ? 'selected' : ''}>Últimos 7 dias</option>
                <option value="mes" ${reportPeriod === 'mes' ? 'selected' : ''}>Este Mês</option>
              </select>
            </div>

            <div class="admin-grid">
              <div class="metric"><small>Pedidos Concluídos</small><strong>${orders.length}</strong></div>
              <div class="metric"><small>Faturamento Bruto</small><strong style="color:var(--green);">${money(totalVal)}</strong></div>
            </div>

            <div style="margin-top:10px;">
              ${orders.map(o => `
                <div class="order-card-history" style="font-size:12px;">
                  <div style="display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding-bottom:4px;margin-bottom:4px;">
                    <b>${o.id} - ${o.customerName}</b>
                    <span style="color:var(--green);font-weight:900;">${money(o.total)}</span>
                  </div>
                  <div><b>Itens:</b> ${(o.items || []).map(it => `${it.qty}x ${it.name}`).join(", ")}</div>
                  <small style="color:#888;">${new Date(o.date).toLocaleString('pt-BR')}</small>
                </div>
              `).join("") || '<p class="hint">Nenhuma venda registrada neste período.</p>'}
            </div>
          </div>
        `;
      } else {
        const soc = p.socials || {};
        container.innerHTML = `
          <div class="panel">
            <h3>Dados & Configurações de ${p.name}</h3>
            <div class="form">
              <div class="field">
                <label>Nome do Estabelecimento</label>
                <input id="stName" value="${p.name || ''}">
              </div>
              <div class="field">
                <label>CNPJ / CPF do Responsável</label>
                <input id="stDoc" value="${p.document || ''}" placeholder="00.000.000/0000-00">
              </div>
              <div class="field">
                <label>Usuário de Login</label>
                <input id="stUser" value="${p.username || ''}" placeholder="Ex: pastel_cia">
              </div>
              <div class="field">
                <label>Senha de Acesso ao Painel</label>
                <input type="text" id="stPass" value="${p.pass || '1234'}" placeholder="Defina sua senha">
              </div>
              <div class="field">
                <label>WhatsApp de Pedidos (DDD + Número)</label>
                <input id="stWhats" value="${p.whatsapp || ''}">
              </div>
              <div class="field">
                <label>Endereço Completo</label>
                <input id="stAddr" value="${p.address || ''}">
              </div>
              <div class="field">
                <label>Taxa de Entrega Padrão</label>
                <input id="stFee" value="${p.delivery || 'R$ 8,00'}">
              </div>
              <div class="field">
                <label>Tempo Estimado</label>
                <input id="stTime" value="${p.time || '30 - 50 min'}">
              </div>
              <div class="field">
                <label>Pedido Mínimo (R$)</label>
                <input id="stMin" type="number" step="0.01" value="${p.minOrder || 15}">
              </div>
              <div class="field">
                <label>Chave Pix da Loja (Para recebimento)</label>
                <input id="stPix" value="${p.pixKey || ''}" placeholder="Chave Pix oficial">
              </div>
              <div class="field">
                <label>Instagram (@seucomercio)</label>
                <input id="stInsta" value="${soc.instagram || ''}">
              </div>
              <div class="field">
                <label>Status de Funcionamento</label>
                <select id="stOpen">
                  <option value="true" ${p.open ? 'selected' : ''}>Aberto para pedidos</option>
                  <option value="false" ${!p.open ? 'selected' : ''}>Fechado temporariamente</option>
                </select>
              </div>
              <button class="btn red" onclick="saveStoreSettings()">Salvar Alterações</button>
            </div>
          </div>
        `;
      }
    }

    function shareOrderToGroup(orderId) {
      const order = (db.orders || []).find(o => o.id === orderId);
      if (!order) return;

      const acceptUrl = `${window.location.origin}${window.location.pathname.replace('loja.html','index.html')}?corrida=${order.id}`;
      let msg = [];
      msg.push(`🛵 *NOVA CORRIDA R1 DISPONÍVEL!*`);
      msg.push(`📦 *Pedido:* ${order.id}`);
      msg.push(`🏪 *Retirada:* ${order.storeName} (${order.storeAddress || ''})`);
      msg.push(`🏠 *Entrega:* ${order.customerName} - ${order.customerAddress}`);
      msg.push(`💰 *Taxa do Frete:* ${order.deliveryFeeText || 'R$ 8,00'}`);
      msg.push(`-----------------------------------`);
      msg.push(`👉 *Toque para aceitar:* ${acceptUrl}`);

      const groupLink = db.config && db.config.whatsappGroupLink;
      if (groupLink && groupLink.startsWith("http")) {
        window.open(groupLink, "_blank");
      } else {
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg.join("\n"))}`, "_blank");
      }
    }

    function updateOrderStatus(orderId, st) {
      const o = (db.orders || []).find(x => x.id === orderId);
      if (o) {
        o.status = st;
        saveDb();
        renderCurrentTab();
        toast(`Status atualizado para: ${st}`);
      }
    }

    function hideOrder(orderId) {
      const o = (db.orders || []).find(x => x.id === orderId);
      if (o) {
        o.hiddenForStore = true;
        saveDb();
        renderCurrentTab();
        toast("Pedido ocultado da tela.");
      }
    }

    function addProduct() {
      const p = loggedPartner;
      const n = document.getElementById("newName").value.trim();
      const price = Number(document.getElementById("newPrice").value);
      const cat = document.getElementById("newCat").value;
      const desc = document.getElementById("newDesc").value.trim();
      const isPromo = document.getElementById("newIsPromo").checked;
      const imgUrl = document.getElementById("newImgUrl").value.trim();

      if (!n || isNaN(price) || price <= 0) return toast("Preencha nome e preço.");

      if (!p.categories) p.categories = [];
      let c = p.categories.find(x => x.name === cat);
      if (!c) {
        c = { name: cat || "GERAL", products: [] };
        p.categories.push(c);
      }

      c.products.push({
        id: "p_" + Date.now(),
        name: n,
        isPromo: isPromo,
        desc: desc,
        price: price,
        image: imgUrl || "",
        paused: false
      });

      saveDb();
      renderCurrentTab();
      toast("Produto adicionado com sucesso!");
    }

    function openEditProduct(catName, prodIdx) {
      const p = loggedPartner;
      const c = (p.categories || []).find(x => x.name === catName);
      if (!c || !c.products[prodIdx]) return;

      const prod = c.products[prodIdx];
      document.getElementById("editProdCatName").value = catName;
      document.getElementById("editProdIndex").value = prodIdx;
      document.getElementById("editProdName").value = prod.name;
      document.getElementById("editProdPrice").value = prod.price;
      document.getElementById("editProdDesc").value = prod.desc || "";
      document.getElementById("editProdImg").value = prod.image || "";
      document.getElementById("editProdIsPromo").checked = !!prod.isPromo;
      document.getElementById("editProdPaused").checked = !!prod.paused;
      
      const prevEl = document.getElementById("editProdPreview");
      prevEl.innerHTML = prod.image ? `<img src="${prod.image}">` : "Sem Foto";

      openModal("editProductModal");
    }

    function saveProductEdits() {
      const p = loggedPartner;
      const catName = document.getElementById("editProdCatName").value;
      const prodIdx = parseInt(document.getElementById("editProdIndex").value);

      const c = (p.categories || []).find(x => x.name === catName);
      if (c && c.products[prodIdx]) {
        const prod = c.products[prodIdx];
        prod.name = document.getElementById("editProdName").value.trim() || prod.name;
        prod.price = Number(document.getElementById("editProdPrice").value) || prod.price;
        prod.desc = document.getElementById("editProdDesc").value.trim();
        prod.image = document.getElementById("editProdImg").value.trim();
        prod.isPromo = document.getElementById("editProdIsPromo").checked;
        prod.paused = document.getElementById("editProdPaused").checked;

        saveDb();
        closeModal("editProductModal");
        renderCurrentTab();
        toast("Produto atualizado!");
      }
    }

    function togglePauseProduct(catName, prodIdx) {
      const p = loggedPartner;
      const c = (p.categories || []).find(x => x.name === catName);
      if (c && c.products[prodIdx]) {
        c.products[prodIdx].paused = !c.products[prodIdx].paused;
        saveDb();
        renderCurrentTab();
        toast("Status do produto alterado!");
      }
    }

    function removeProduct(catName, prodIdx) {
      const p = loggedPartner;
      const c = (p.categories || []).find(x => x.name === catName);
      if (c && confirm("Deseja excluir este item?")) {
        c.products.splice(prodIdx, 1);
        saveDb();
        renderCurrentTab();
        toast("Produto removido.");
      }
    }

    function processBatch() {
      const p = loggedPartner;
      const cat = document.getElementById("batchCat").value;
      const text = document.getElementById("batchText").value.trim();

      if (!text) return toast("Cole a lista para importar.");

      const lines = text.split("\n");
      let count = 0;

      if (!p.categories) p.categories = [];
      let c = p.categories.find(x => x.name === cat);
      if (!c) {
        c = { name: cat || "GERAL", products: [] };
        p.categories.push(c);
      }

      lines.forEach(line => {
        const parts = line.split("-").map(s => s.trim());
        if (parts.length >= 2) {
          const name = parts[0];
          let desc = parts.length >= 3 ? parts[1] : "";
          let price = parseFloat((parts.length >= 3 ? parts[2] : parts[1]).replace(/[^\d.,]/g, "").replace(",", ".")) || 0;

          if (name && price > 0) {
            c.products.push({
              id: "p_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4),
              name, desc, price, image: "", isPromo: false, paused: false
            });
            count++;
          }
        }
      });

      saveDb();
      switchTab("produtos", document.querySelectorAll(".tab")[1]);
      toast(`🎉 ${count} produtos importados!`);
    }

    function addStatus() {
      const p = loggedPartner;
      const title = document.getElementById("stTitle").value.trim();
      const type = document.getElementById("stType").value;
      const url = document.getElementById("stUrl").value.trim();

      if (!url) return toast("Selecione um arquivo ou link.");

      if (!p.statuses) p.statuses = [];
      p.statuses.push({ title, type, url });
      saveDb();
      renderCurrentTab();
      toast("Stories publicado com sucesso!");
    }

    function removeStatus(idx) {
      const p = loggedPartner;
      if (confirm("Deseja excluir este stories?")) {
        p.statuses.splice(idx, 1);
        saveDb();
        renderCurrentTab();
        toast("Stories removido.");
      }
    }

    function saveBanner() {
      const p = loggedPartner;
      p.banner = document.getElementById("bannerUrl").value.trim();
      saveDb();
      toast("Capa salva com sucesso!");
    }

    function saveStoreSettings() {
      const p = loggedPartner;
      p.name = document.getElementById("stName").value.trim();
      p.document = document.getElementById("stDoc").value.trim();
      p.username = (document.getElementById("stUser").value.trim() || p.username || "").toLowerCase();
      p.pass = document.getElementById("stPass").value.trim() || "1234";
      p.whatsapp = document.getElementById("stWhats").value.trim().replace(/\D/g, "");
      p.address = document.getElementById("stAddr").value.trim();
      p.delivery = document.getElementById("stFee").value.trim();
      p.time = document.getElementById("stTime").value.trim();
      p.minOrder = Number(document.getElementById("stMin").value) || 0;
      p.pixKey = document.getElementById("stPix").value.trim();
      p.open = document.getElementById("stOpen").value === "true";
      if (!p.socials) p.socials = {};
      p.socials.instagram = document.getElementById("stInsta").value.trim();

      saveDb();
      enterDashboard();
      toast("Configurações e senha salvas com sucesso!");
    }

    function previewDirect(inputId, previewId) {
      const val = document.getElementById(inputId).value.trim();
      const el = document.getElementById(previewId);
      if (val) {
        const isVid = val.endsWith(".mp4") || val.includes("video");
        el.innerHTML = isVid 
          ? `<video src="${val}" controls style="width:100%;height:100%;object-fit:contain;"></video>`
          : `<img src="${val}" alt="preview">`;
      } else {
        el.innerHTML = "Prévia";
      }
    }

    function previewUpload(input, previewElementId, targetInputId, maxDim = 400) {
      const file = input.files[0];
      if (!file) return;

      const previewEl = document.getElementById(previewElementId);
      previewEl.innerHTML = "<small style='color:#666;'>Processando...</small>";

      if (file.type.startsWith("video")) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const base64 = e.target.result;
          if (targetInputId) document.getElementById(targetInputId).value = base64;
          previewEl.innerHTML = `<video src="${base64}" controls style="width:100%;height:100%;object-fit:contain;"></video>`;
        };
        reader.readAsDataURL(file);
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          let width = img.width;
          let height = img.height;
          if (width > height) {
            if (width > maxDim) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            }
          } else {
            if (height > maxDim) {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          const optimizedBase64 = canvas.toDataURL("image/jpeg", 0.65);
          if (targetInputId) document.getElementById(targetInputId).value = optimizedBase64;
          previewEl.innerHTML = `<img src="${optimizedBase64}" alt="preview">`;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
